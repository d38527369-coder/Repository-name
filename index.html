<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Paw Tycoon Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --dark-bg: #0b0e16;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Шапка */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--neon-purple);
        }

        .stat { text-align: center; }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--neon-green); }
        .stat-label { font-size: 10px; opacity: 0.6; text-transform: uppercase; }

        /* Контентні зони */
        .page { display: none; flex-grow: 1; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .page.active { display: flex; }

        /* Екран ГРИ */
        .cat-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-cat {
            width: 240px;
            height: 240px;
            background: url('https://img.freepik.com/free-photo/view-neon-illuminated-cat_23-2150491404.jpg') center/cover;
            border-radius: 50%;
            border: 6px solid var(--neon-purple);
            box-shadow: 0 0 30px var(--neon-purple);
            cursor: pointer;
            transition: transform 0.05s;
        }

        .main-cat:active { transform: scale(0.95); }

        .energy-container {
            width: 80%;
            margin-top: 30px;
            text-align: center;
        }

        .energy-bar {
            width: 100%;
            height: 12px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--neon-green);
        }

        .energy-fill {
            width: 100%;
            height: 100%;
            background: var(--neon-green);
            transition: width 0.2s;
        }

        /* Екран МАГАЗИНУ */
        .shop-list {
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--neon-purple);
        }

        .buy-btn {
            background: var(--neon-green);
            color: black;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Нижнє меню */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: #161b22;
            border-top: 1px solid #30363d;
        }

        .nav-item {
            opacity: 0.5;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-item.active { opacity: 1; color: var(--neon-purple); font-weight: bold; }

        /* Анімація цифр */
        .plus-one {
            position: absolute;
            color: var(--neon-green);
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
        }

@keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }

<body>

    <div class="header">
        <div class="stat">
            <div id="balance" class="stat-value">0</div>
            <div class="stat-label">💰 Монети</div>
        </div>
        <div class="stat">
            <div id="per-click" class="stat-value">1</div>
            <div class="stat-label">⚡️ За клік</div>
        </div>
    </div>

    <div id="game-page" class="page active">
        <div class="cat-container">
            <div class="main-cat" onclick="clickCat(event)"></div>
        </div>
        <div class="energy-container">
            <div class="stat-label">Енергія: <span id="energy-text">100</span>/100</div>
            <div class="energy-bar">
                <div id="energy-fill" class="energy-fill"></div>
            </div>
        </div>
    </div>

    <div id="shop-page" class="page">
        <h2 style="color: var(--neon-purple);">МАГАЗИН</h2>
        <div class="shop-list">
            <div class="shop-item">
                <div>
                    <div><b>Супер Лапа</b></div>
                    <div style="font-size: 12px; opacity: 0.7;">+1 до кожного кліку</div>
                </div>
                <button class="buy-btn" onclick="buyUpgrade(100, 1)">100 💰</button>
            </div>
            <div class="shop-item">
                <div>
                    <div><b>Мега Кіт</b></div>
                    <div style="font-size: 12px; opacity: 0.7;">+5 до кожного кліку</div>
                </div>
                <button class="buy-btn" onclick="buyUpgrade(500, 5)">500 💰</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="nav-game" onclick="showPage('game')">ГРАТИ</div>
        <div class="nav-item" id="nav-shop" onclick="showPage('shop')">МАГАЗИН</div>
    </div>

    <script>
        let balance = 0;
        let perClick = 1;
        let energy = 100;

        function clickCat(e) {
            if (energy > 0) {
                balance += perClick;
                energy -= 1;
                updateUI();
                spawnText(e);
                
                if (window.Telegram.WebApp) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
                }
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance);
            document.getElementById('per-click').innerText = perClick;
            document.getElementById('energy-fill').style.width = energy + "%";
            document.getElementById('energy-text').innerText = energy;
        }

        function spawnText(e) {
            const t = document.createElement('div');
            t.className = 'plus-one';
            t.innerText = "+" + perClick;
            t.style.left = e.clientX + "px";
            t.style.top = e.clientY + "px";
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 700);
        }

        function showPage(page) {
            document.getElementById('game-page').classList.remove('active');
            document.getElementById('shop-page').classList.remove('active');
            document.getElementById('nav-game').classList.remove('active');
            document.getElementById('nav-shop').classList.remove('active');

            if(page === 'game') {
                document.getElementById('game-page').classList.add('active');
                document.getElementById('nav-game').classList.add('active');
            } else {
                document.getElementById('shop-page').classList.add('active');
                document.getElementById('nav-shop').classList.add('active');
            }
        }
